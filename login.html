<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hshsocool · LOGIN ADMIN</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --card: #17171b;
            --field: #222228;
            --field-2: #2b2b33;
            --text: #f1ecf7;
            --muted: #9a8fab;
            --accent: #f7a8cf;
            --accent-2: #ffc9e3;
            --ok: #6ee7b7;
            --err: #fb7185;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: "Kanit", "Noto Sans Thai", "Segoe UI", Tahoma, sans-serif;
            font-size: 15px;
        }

        .center {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .card {
            width: 100%;
            max-width: 380px;
            padding: 34px 28px 28px;
            border-radius: 24px;
            background: var(--card);
            text-align: center;
            opacity: 0;
            transform: translateY(28px) scale(.95);
            animation: enter .6s .05s cubic-bezier(.2, 1.25, .35, 1) forwards;
        }

        @keyframes enter {
            to {
                opacity: 1;
                transform: none;
            }
        }

        .badge {
            position: relative;
            width: 76px;
            height: 76px;
            margin: 0 auto 26px;
        }

        .badge .disc {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(247, 168, 207, .16);
            transform: scale(0);
            animation: pop .5s .25s cubic-bezier(.2, 1.4, .4, 1) forwards;
        }

        .badge .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(247, 168, 207, .22);
            opacity: 0;
            animation: ripple 2s .8s ease-out infinite;
        }

        .badge svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .badge .ico {
            fill: none;
            stroke: var(--accent);
            stroke-width: 3.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .badge .lock-body {
            stroke-dasharray: 120;
            stroke-dashoffset: 120;
            animation: draw .7s .5s ease-out forwards;
        }

        .badge .lock-shackle {
            transform-origin: 38px 34px;
            animation: draw .5s .8s ease-out forwards, unlockIdle 3.2s 2s ease-in-out infinite;
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
        }

        .badge .tick {
            fill: none;
            stroke: var(--ok);
            stroke-width: 4.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 40;
            stroke-dashoffset: 40;
            opacity: 0;
        }

        .ok .badge .disc {
            background: rgba(110, 231, 183, .18);
        }

        .ok .badge .ring {
            background: rgba(110, 231, 183, .22);
        }

        .ok .badge .ico {
            opacity: 0;
            transition: opacity .15s;
        }

        .ok .badge .tick {
            opacity: 1;
            animation: draw .5s .1s ease-out forwards;
        }

        @keyframes pop {
            to {
                transform: scale(1);
            }
        }

        @keyframes draw {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: .7;
            }
            100% {
                transform: scale(1.7);
                opacity: 0;
            }
        }

        @keyframes unlockIdle {
            0%,
            88%,
            100% {
                transform: translateY(0);
            }
            93% {
                transform: translateY(-2px);
            }
        }

        h1 {
            margin: 0 0 4px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: .4px;
        }

        h1 span {
            color: var(--accent);
        }

        .sub {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 14px;
        }

        .rise {
            opacity: 0;
            transform: translateY(10px);
            animation: rise .5s ease forwards;
        }

        .d1 {
            animation-delay: .35s;
        }

        .d2 {
            animation-delay: .45s;
        }

        .d3 {
            animation-delay: .55s;
        }

        .d4 {
            animation-delay: .65s;
        }

        @keyframes rise {
            to {
                opacity: 1;
                transform: none;
            }
        }

        .field {
            position: relative;
            text-align: left;
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            margin: 0 0 5px 4px;
            font-size: 12px;
            color: var(--muted);
        }

        .field input {
            width: 100%;
            border: 0;
            outline: 0;
            border-radius: 14px;
            background: var(--field);
            color: var(--text);
            font: inherit;
            font-size: 16px;
            padding: 13px 46px 13px 16px;
            transition: background .2s;
        }

        .field input:focus {
            background: var(--field-2);
        }

        .field input.bad {
            background: rgba(251, 113, 133, .2);
            animation: shake .4s;
        }

        @keyframes shake {
            20% {
                transform: translateX(-6px);
            }
            50% {
                transform: translateX(6px);
            }
            80% {
                transform: translateX(-3px);
            }
        }

        /* ป้องกันเบราว์เซอร์ทาพื้น autofill เป็นสีฟ้าอ่อน */

        .field input:-webkit-autofill {
            -webkit-text-fill-color: var(--text);
            caret-color: var(--text);
            transition: background-color 99999s 0s;
        }

        .eye {
            position: absolute;
            right: 6px;
            bottom: 5px;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 10px;
            background: none;
            color: var(--muted);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: color .2s, background .2s;
        }

        .eye:hover {
            color: var(--accent-2);
            background: rgba(255, 255, 255, .06);
        }

        .eye svg {
            width: 19px;
            height: 19px;
        }

        .go {
            width: 100%;
            margin-top: 6px;
            border: 0;
            border-radius: 14px;
            padding: 13px 16px;
            background: var(--accent);
            color: #2a0f1d;
            font: inherit;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background .2s, transform .15s;
        }

        .go:hover {
            background: var(--accent-2);
        }

        .go:active {
            transform: scale(.98);
        }

        .go:disabled {
            opacity: .7;
            cursor: default;
        }

        .spin {
            display: inline-block;
            width: 15px;
            height: 15px;
            margin-right: 9px;
            vertical-align: -2px;
            border-radius: 50%;
            border: 2px solid rgba(42, 15, 29, .25);
            border-top-color: #2a0f1d;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .msg {
            min-height: 20px;
            margin-top: 12px;
            font-size: 13px;
            color: var(--err);
        }

        .powered {
            margin-top: 28px;
            font-size: 13px;
            letter-spacing: .5px;
            color: var(--muted);
            opacity: 0;
            animation: fade .6s 1s ease forwards;
        }

        @keyframes fade {
            to {
                opacity: .7;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card,
            .rise,
            .powered,
            .badge .disc {
                animation: none !important;
                opacity: 1;
                transform: none;
            }
            .powered {
                opacity: .7;
            }
            .badge .ring {
                display: none;
            }
            .badge .lock-body,
            .badge .lock-shackle,
            .ok .badge .tick {
                animation: none !important;
                stroke-dashoffset: 0;
            }
        }
    </style>
</head>

<body>
    <div class="center" id="center">
        <form class="card" id="form" autocomplete="on">
            <div class="badge">
                <span class="ring"></span>
                <span class="disc"></span>
                <svg viewBox="0 0 76 76">
                    <path class="ico lock-shackle" d="M29 36v-6a9 9 0 0 1 18 0v6"/>
                    <rect class="ico lock-body" x="23" y="36" width="30" height="21" rx="6"/>
                    <path class="tick" d="M24 39l10 10 19-21"/>
                </svg>
            </div>

            <div class="field rise d2">
                <label for="key">คีย์แอดมิน</label>
                <input type="password" id="key" autocomplete="current-password" autofocus>
                <button type="button" class="eye" id="eye" aria-label="แสดง/ซ่อนคีย์" tabindex="-1">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="eyeIcon"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>

            <button type="submit" class="go rise d3" id="submit">เข้าสู่ระบบ</button>
            <div class="msg" id="msg" role="alert"></div>
        </form>

        <div class="powered">NONGCHEDEKNALAK</div>
    </div>

    <script>
        const center = document.getElementById('center');
        const form = document.getElementById('form');
        const keyInput = document.getElementById('key');
        const submit = document.getElementById('submit');
        const msg = document.getElementById('msg');
        const eye = document.getElementById('eye');
        const eyeIcon = document.getElementById('eyeIcon');

        const EYE_OPEN = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
        const EYE_OFF = '<path d="M3 3l18 18M10.6 6.2A9.8 9.8 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.4 7.7A16.6 16.6 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4-.9M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';
        eye.addEventListener('click', () => {
            const show = keyInput.type === 'password';
            keyInput.type = show ? 'text' : 'password';
            eyeIcon.innerHTML = show ? EYE_OFF : EYE_OPEN;
            keyInput.focus();
        });

        const fail = (text) => {
            msg.textContent = text;
            keyInput.classList.remove('bad');
            void keyInput.offsetWidth;
            keyInput.classList.add('bad');
            keyInput.focus();
            keyInput.select();
        };
        keyInput.addEventListener('input', () => {
            keyInput.classList.remove('bad');
            msg.textContent = '';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.textContent = '';
            if (!keyInput.value) {
                fail('กรุณากรอกคีย์แอดมิน');
                return;
            }
            submit.disabled = true;
            submit.innerHTML = '<span class="spin"></span>กำลังเข้าสู่ระบบ';
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        key: keyInput.value
                    })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data.success) {
                    center.classList.add('ok');
                    submit.innerHTML = 'สำเร็จ';
                    setTimeout(() => {
                        location.href = '/';
                    }, 700);
                    return;
                }
                fail(data.error || 'เข้าสู่ระบบไม่สำเร็จ');
            } catch (_) {
                fail('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้');
            }
            submit.disabled = false;
            submit.textContent = 'เข้าสู่ระบบ';
        });
    </script>

        crossorigin="anonymous"></script>
</body>

</html>
